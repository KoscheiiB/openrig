# Throwaway Buzz 1.0 protocol lab; ports restricted to host loopback.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: buzz
      POSTGRES_USER: buzz
      POSTGRES_PASSWORD: ${LAB_DATABASE_PASSWORD:?ephemeral}
      PGDATA: /var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buzz -d buzz"]
      interval: 2s
      timeout: 2s
      retries: 25
    mem_limit: 384m
    cpus: 0.75
    restart: "no"
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 25
    mem_limit: 96m
    cpus: 0.25
    restart: "no"
  minio:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${LAB_S3_USER:?ephemeral}
      MINIO_ROOT_PASSWORD: ${LAB_S3_PASSWORD:?ephemeral}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 3s
      timeout: 2s
      retries: 25
    mem_limit: 256m
    cpus: 0.5
    restart: "no"
  minio-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z@sha256:cfc83108c3abb371f8fb84d99c1fdc88f8c237e022409b0081fb7c0a3be634dd
    depends_on:
      minio:
        condition: service_healthy
    environment:
      LAB_S3_USER: ${LAB_S3_USER:?ephemeral}
      LAB_S3_PASSWORD: ${LAB_S3_PASSWORD:?ephemeral}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$$LAB_S3_USER" "$$LAB_S3_PASSWORD" >/dev/null
        mc mb --ignore-existing local/buzz-media >/dev/null
        mc anonymous set none local/buzz-media >/dev/null
    mem_limit: 128m
    restart: "no"
  relay:
    image: ghcr.io/block/buzz@sha256:c68756f7e06be17befbcea48621dfbb699e49fb16428b735b88235cb99527fc4
    environment:
      BUZZ_BIND_ADDR: 0.0.0.0:3000
      BUZZ_HEALTH_PORT: "8080"
      BUZZ_METRICS_PORT: "9102"
      DATABASE_URL: postgres://buzz:${LAB_DATABASE_PASSWORD:?ephemeral}@postgres:5432/buzz
      REDIS_URL: redis://redis:6379
      RELAY_URL: http://127.0.0.1:${LAB_HTTP_PORT:?selected}
      BUZZ_RELAY_PRIVATE_KEY: ${LAB_RELAY_KEY:?ephemeral}
      RELAY_OWNER_PUBKEY: ${LAB_OWNER_PUBKEY:?ephemeral}
      BUZZ_REQUIRE_AUTH_TOKEN: "false"
      # Default to NIP-43 enforcement; caller may explicitly select false for diagnosis.
      BUZZ_REQUIRE_RELAY_MEMBERSHIP: ${LAB_REQUIRE_RELAY_MEMBERSHIP:-true}
      BUZZ_ALLOW_NIP_OA_AUTH: "true"
      BUZZ_AUTO_MIGRATE: "true"
      BUZZ_GIT_CONFORMANCE_PROBE: "false"
      BUZZ_PUSH_ENABLED: "false"
      BUZZ_S3_ENDPOINT: http://minio:9000
      BUZZ_S3_ADDRESSING_STYLE: path
      BUZZ_S3_ACCESS_KEY: ${LAB_S3_USER:?ephemeral}
      BUZZ_S3_SECRET_KEY: ${LAB_S3_PASSWORD:?ephemeral}
      BUZZ_S3_BUCKET: buzz-media
      BUZZ_GIT_REPO_PATH: /tmp/buzz-git
      RUST_LOG: buzz_relay=warn,buzz_db=warn
    ports:
      - "127.0.0.1:${LAB_HTTP_PORT:?selected}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    mem_limit: 1024m
    cpus: 1.5
    restart: "no"
